[package]
name = "rustinfer"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Ultralytics YOLO Rust 推理：全部任务 + TensorRT + GPU 端预处理"
license = "AGPL-3.0"
publish = false

[[bin]]
name = "rustinfer"
path = "src/main.rs"

[[bin]]
name = "rustinfer-api"
path = "src/bin/rustinfer-api.rs"

[dependencies]
ab_glyph = "0.2"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
image = "0.25"
imageproc = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["cors"] }
ultralytics-inference = { version = "0.0.41", default-features = false, features = [
    "annotate",
    "visualize",
] }

[features]
default = ["video", "gpu"]
gpu = ["ultralytics-inference/cuda-preprocess"]
video = ["ultralytics-inference/video"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
